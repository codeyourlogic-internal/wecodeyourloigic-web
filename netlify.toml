# Next.js on Netlify (OpenNext adapter — auto-detected; do not pin @netlify/plugin-nextjs
# unless you intentionally want to freeze the adapter version).

[build]
  command = "npm run build"
  # Required for @netlify/plugin-nextjs. Leaving this empty defaults publish to the
  # repo root (same as base) and the plugin fails with:
  # "publish directory cannot be the same as the base directory"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Mitigates client errors when visitors are mid-session during a new deploy
  NETLIFY_NEXT_SKEW_PROTECTION = "true"
  # Required for contact + careers forms (also set in Netlify UI → Environment variables):
  # NEXT_PUBLIC_FORM_ACCESS_KEY

# Post-processing can rewrite HTML/assets and break Next.js. Keep it off.
[build.processing]
  skip_processing = true

# ---------------------------------------------------------------------------
# Domain aliases → primary (301 aliases do NOT auto-redirect in Netlify UI)
# Host conditions are unsupported — use full https://domain/* form.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "https://wecodeyourlogic.com/*"
  to = "https://codeyourlogic.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://wecodeyourlogic.com"
  to = "https://codeyourlogic.com/"
  status = 301
  force = true

[[redirects]]
  from = "http://wecodeyourlogic.com/*"
  to = "https://codeyourlogic.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://wecodeyourlogic.com"
  to = "https://codeyourlogic.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.wecodeyourlogic.com/*"
  to = "https://codeyourlogic.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.wecodeyourlogic.com"
  to = "https://codeyourlogic.com/"
  status = 301
  force = true

[[redirects]]
  from = "http://www.wecodeyourlogic.com/*"
  to = "https://codeyourlogic.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.wecodeyourlogic.com"
  to = "https://codeyourlogic.com/"
  status = 301
  force = true

